name: Publish Sparkle Feed

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "assets/screenshot.png"
      - "assets/Website Favicon/**"
      - "assets/Website Icon (logo on page : header)/**"
      - "dist-appcast/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare publish directory
        run: |
          rm -rf .pages
          mkdir -p .pages
          cp -R site/. .pages/
          mkdir -p .pages/assets
          cp -R "assets/Website Favicon" ".pages/assets/Website Favicon"
          cp -R "assets/Website Icon (logo on page : header)" ".pages/assets/Website Icon (logo on page : header)"
          mkdir -p .pages/dist-appcast
          cp -R dist-appcast/. .pages/dist-appcast/
          css_hash=$(sha256sum .pages/styles.css | cut -c1-12)
          js_hash=$(sha256sum .pages/script.js | cut -c1-12)
          mv .pages/styles.css ".pages/styles.${css_hash}.css"
          mv .pages/script.js ".pages/script.${js_hash}.js"
          find .pages -maxdepth 1 -name '*.html' -print0 | xargs -0 sed -i \
            -e "s|./styles.css|./styles.${css_hash}.css|g" \
            -e "s|./script.js|./script.${js_hash}.js|g"
          touch .pages/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
