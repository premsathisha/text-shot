<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)" />
    <title>Text Shot</title>
    <meta
      name="description"
      content="Text Shot is a lightweight macOS screenshot-to-text utility built for fast local OCR."
    />
    <link rel="icon" type="image/png" href="./assets/Icon-iOS-Dark-1024x1024@1x.png" />
    <link rel="apple-touch-icon" href="./assets/Icon-iOS-Dark-1024x1024@1x.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="site-shell">
      <nav class="site-nav">
        <a class="nav-logo" href="./index.html">
          <span class="nav-logo-icon">
            <img src="./assets/Icon-iOS-Dark-1024x1024@1x.png" alt="Text Shot app icon" />
          </span>
          Text Shot
        </a>

        <div class="nav-actions">
          <span class="nav-badge" id="release-badge">v3.0.3</span>
        </div>
      </nav>

      <section class="hero">
        <h1 class="hero-headline">
          Capture text from anywhere. <span class="word-accent">Instantly.</span>
        </h1>

        <div class="hero-btns">
          <a
            class="btn-primary"
            id="download-button"
            href="https://github.com/premsathisha/text-shot/releases/latest"
          >
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M7 1v8M4 6l3 3 3-3M2 11h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Download for macOS
          </a>
          <a
            class="btn-ghost"
            href="https://github.com/premsathisha/text-shot"
            target="_blank"
            rel="noreferrer"
          >
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
              <rect x="1" y="1" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.2"/>
              <path d="M4 5h5M4 7.5h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
            View Docs
          </a>
        </div>

        <div class="hero-screenshot-placeholder">
          <img src="./assets/screenshot.png?v=20260328b" alt="Text Shot screenshot" />
        </div>
      </section>

      <footer class="site-footer">
        <div class="footer-inner">
          <span class="footer-copyright"
            >Copyright &copy; 2026 Prem Sathisha Etagi. All Rights Reserved.</span
          >
          <div class="footer-meta">
            <a
              class="license-link"
              href="https://github.com/premsathisha/text-shot/blob/main/LICENSE"
              target="_blank"
              rel="noreferrer"
            >
              MIT License
            </a>
          </div>
        </div>
      </footer>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
